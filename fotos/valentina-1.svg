          fill="#CFA585" opacity=".35"/>
    <!-- lábio -->
    <path d="M306 340 C 314 336 322 337 328 341" fill="none"
          stroke="#c19e80" stroke-width="1.8" stroke-opacity=".55" stroke-linecap="round"/>
    <!-- orelha -->
    <path d="M452 306 C 468 300 478 312 476 332 C 474 352 462 362 450 356 Z"
          fill="#e9c6a8"/>
    <path d="M458 316 C 466 314 470 322 468 332" fill="none"
          stroke="#CFA585" stroke-width="1.6" stroke-opacity=".8"/>
  </g>
  <g transform="translate(0 0)"><path d="M322 246
      C 324 212 340 190 362 180
      C 380 172 392 168 402 168
      C 440 168 474 184 490 210
      C 504 234 508 264 504 296
      L 476 300
      C 478 262 468 228 446 208
      C 424 188 388 196 366 224
      C 352 242 342 262 336 288 Z" fill="url(#hairg)"/></g>
  
  <g transform="translate(0 0)">
    <circle cx="474" cy="344" r="6.5" fill="#B08A5C"/>
    <circle cx="474" cy="364" r="4" fill="#B08A5C" opacity=".85"/>
    <path d="M372 520 C 388 542 420 542 436 520" fill="none"
          stroke="#B08A5C" stroke-width="1.5" stroke-opacity=".7"/>
  </g>
  
  <g font-family="Georgia, 'Times New Roman', serif" fill="#B08A5C">
    <text x="52" y="64" font-size="16" letter-spacing="5.5" opacity=".8">LUMIÈRE MADRID</text>
    <text x="52" y="92" font-size="10.5" letter-spacing="4" opacity=".55">RETRATO DE DEMOSTRACIÓN</text>
  </g>
  <rect x="28" y="28" width="744" height="944" fill="none"
        stroke="#B08A5C" stroke-opacity=".36" stroke-width="1.1"/>
</svg>