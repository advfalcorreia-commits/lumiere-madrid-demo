  </g>
  
  <g transform="translate(0 0)">
    <path d="M400 168
  C 350 168 318 196 312 226
  C 309 246 312 252 310 262
  C 308 272 300 284 296 300
  C 293 312 302 318 310 320
  C 305 330 306 334 310 340
  C 305 348 305 356 312 362
  C 320 372 330 376 336 382
  C 344 396 352 402 366 406
  C 400 414 436 412 462 392
  C 486 374 500 348 502 314
  C 505 262 486 214 452 190
  C 436 178 418 168 400 168 Z" fill="url(#sking)"/>
    <!-- sombra na nuca / interior do cabelo -->
    <path d="M452 190 C 486 214 505 262 502 314 C 500 348 486 374 462 392
