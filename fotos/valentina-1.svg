<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img">
  <title>Valentina — retrato ilustrado de demostración</title>
  
  <rect width="800" height="1000" fill="#F3EBE0"/>
  <defs>
    <radialGradient id="halo" cx="402" cy="420" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6D8C3" stop-opacity="1"/>
      <stop offset=".6" stop-color="#E6D8C3" stop-opacity=".5"/>
      <stop offset="1" stop-color="#E6D8C3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#B99B70"/>
      <stop offset="1" stop-color="#8E7450"/>
    </linearGradient>
    <linearGradient id="sking" x1=".2" y1=".1" x2=".9" y2=".9">
      <stop offset="0" stop-color="#f7d4b6"/>
      <stop offset=".55" stop-color="#EFCCAE"/>
      <stop offset="1" stop-color="#CFA585"/>
    </linearGradient>
    <linearGradient id="hairg" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#4C3A30"/>
      <stop offset=".4" stop-color="#241A14"/>
      <stop offset="1" stop-color="#1f150f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#halo)"/>
  <circle cx="402" cy="420" r="162.39999999999998" fill="none" stroke="#B08A5C" stroke-opacity=".26" stroke-width="1.1"/>
  <g transform="translate(0 0)">
        <path d="M352 200 C 420 148 508 176 524 258
