<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img">
  <title>Naomi — retrato ilustrado de demostración</title>
  
  <rect width="800" height="1000" fill="#F3EADC"/>
  <defs>
    <radialGradient id="halo" cx="402" cy="420" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E5D4BD" stop-opacity="1"/>
      <stop offset=".6" stop-color="#E5D4BD" stop-opacity=".5"/>
      <stop offset="1" stop-color="#E5D4BD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#C7A77A"/>
      <stop offset="1" stop-color="#9E8158"/>
    </linearGradient>
    <linearGradient id="sking" x1=".2" y1=".1" x2=".9" y2=".9">
      <stop offset="0" stop-color="#ad7246"/>
      <stop offset=".55" stop-color="#A56A3E"/>
      <stop offset="1" stop-color="#7C4C29"/>
    </linearGradient>
    <linearGradient id="hairg" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#3C2C22"/>
      <stop offset=".4" stop-color="#1B120D"/>
      <stop offset="1" stop-color="#160d08"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#halo)"/>
  <circle cx="402" cy="420" r="162.39999999999998" fill="none" stroke="#A6805A" stroke-opacity=".26" stroke-width="1.1"/>
  <g transform="translate(0 0)" fill="url(#hairg)">
        <circle cx="470" cy="200" r="48"/><circle cx="404" cy="176" r="52"/>
        <circle cx="352" cy="216" r="40"/><circle cx="510" cy="262" r="50"/>
        <circle cx="512" cy="336" r="46"/><circle cx="492" cy="400" r="40"/>
        <circle cx="446" cy="196" r="40"/></g>
      <g transform="translate(0 0)" fill="#3C2C22" opacity=".4">
        <circle cx="430" cy="188" r="14"/><circle cx="486" cy="240" r="12"/>
        <circle cx="498" cy="330" r="10"/></g>
  
  <g transform="translate(0 0)">
    <!-- pescoço e colo -->
    <path d="M356 372 C 354 432 348 476 338 520
             L 470 520 C 466 468 462 420 456 372 Z" fill="url(#sking)"/>
    <ellipse cx="404" cy="540" rx="104" ry="76" fill="url(#sking)"/>
    <!-- sombra sob o maxilar -->
    <path d="M356 372 C 372 424 420 448 456 372
