  </g>
  
  <g transform="translate(0 0)">
    <path d="M400 168
  C 350 168 318 196 312 226
  C 309 246 312 252 310 262
  C 308 272 300 284 296 300
  C 293 312 302 318 310 320
  C 305 330 306 334 310 340
  C 305 348 305 356 312 362
  C 320 372 330 376 336 382
  C 344 396 352 402 366 406
  C 400 414 436 412 462 392
  C 486 374 500 348 502 314
  C 505 262 486 214 452 190
  C 436 178 418 168 400 168 Z" fill="url(#sking)"/>
    <!-- sombra na nuca / interior do cabelo -->
    <path d="M452 190 C 486 214 505 262 502 314 C 500 348 486 374 462 392
             C 470 356 470 300 458 250 C 448 214 432 196 414 186 Z"
          fill="#7C4C29" opacity=".35"/>
    <!-- lábio -->
    <path d="M306 340 C 314 336 322 337 328 341" fill="none"
          stroke="#773c10" stroke-width="1.8" stroke-opacity=".55" stroke-linecap="round"/>
    <!-- orelha -->
    <path d="M452 306 C 468 300 478 312 476 332 C 474 352 462 362 450 356 Z"
          fill="#9f6438"/>
    <path d="M458 316 C 466 314 470 322 468 332" fill="none"
          stroke="#7C4C29" stroke-width="1.6" stroke-opacity=".8"/>
  </g>
  <g transform="translate(0 0)" fill="url(#hairg)">
      <circle cx="372" cy="196" r="34"/><circle cx="330" cy="236" r="26"/>
      <circle cx="452" cy="192" r="32"/><circle cx="494" cy="224" r="28"/>
      <circle cx="322" cy="276" r="20"/><path d="M322 246
      C 324 212 340 190 362 180
      C 380 172 392 168 402 168
      C 440 168 474 184 490 210
      C 504 234 508 264 504 296
      L 476 300
      C 478 262 468 228 446 208
      C 424 188 388 196 366 224
      C 352 242 342 262 336 288 Z" fill="url(#hairg)"/></g>
  
  <g transform="translate(0 0)">
    <circle cx="474" cy="344" r="6.5" fill="#A6805A"/>
    <circle cx="474" cy="364" r="4" fill="#A6805A" opacity=".85"/>
    <path d="M372 520 C 388 542 420 542 436 520" fill="none"
          stroke="#A6805A" stroke-width="1.5" stroke-opacity=".7"/>
  </g>
  
  <g font-family="Georgia, 'Times New Roman', serif" fill="#A6805A">
    <text x="52" y="64" font-size="16" letter-spacing="5.5" opacity=".8">LUMIÈRE MADRID</text>
    <text x="52" y="92" font-size="10.5" letter-spacing="4" opacity=".55">RETRATO DE DEMOSTRACIÓN</text>
  </g>
  <rect x="28" y="28" width="744" height="944" fill="none"
        stroke="#A6805A" stroke-opacity=".36" stroke-width="1.1"/>
</svg>