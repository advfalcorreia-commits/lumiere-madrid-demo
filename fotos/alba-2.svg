        <path d="M500 470 C 514 528 506 578 516 626
                 C 490 614 470 586 462 548
                 C 474 522 488 496 496 470 Z" fill="url(#hairg)"/></g>
  
  <g transform="translate(16 0)">
    <!-- pescoço e colo -->
    <path d="M356 372 C 354 432 348 476 338 520
             L 470 520 C 466 468 462 420 456 372 Z" fill="url(#sking)"/>
    <ellipse cx="404" cy="540" rx="104" ry="76" fill="url(#sking)"/>
    <!-- sombra sob o maxilar -->
    <path d="M356 372 C 372 424 420 448 456 372
