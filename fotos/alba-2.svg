<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img">
  <title>Alba — retrato ilustrado de demostración</title>
  
  <rect width="800" height="1000" fill="#F2E9DB"/>
  <defs>
    <radialGradient id="halo" cx="440" cy="400" r="305" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E3D4BE" stop-opacity="1"/>
      <stop offset=".6" stop-color="#E3D4BE" stop-opacity=".5"/>
      <stop offset="1" stop-color="#E3D4BE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#7E6E5A"/>
      <stop offset="1" stop-color="#5E5140"/>
    </linearGradient>
    <linearGradient id="sking" x1=".2" y1=".1" x2=".9" y2=".9">
      <stop offset="0" stop-color="#ce935f"/>
      <stop offset=".55" stop-color="#C68B57"/>
      <stop offset="1" stop-color="#9E6A3D"/>
    </linearGradient>
    <linearGradient id="hairg" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#4F3C2B"/>
      <stop offset=".4" stop-color="#2B2118"/>
      <stop offset="1" stop-color="#261c13"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#halo)"/>
  <circle cx="440" cy="400" r="176.89999999999998" fill="none" stroke="#9C7B57" stroke-opacity=".26" stroke-width="1.1"/>
  <g transform="translate(400 430) scale(1.34) translate(-400 -430)"><g transform="translate(16 0)">
        <path d="M350 198 C 420 146 510 176 524 262
