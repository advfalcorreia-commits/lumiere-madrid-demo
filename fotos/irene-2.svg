                 C 528 300 512 250 486 216 Z" fill="url(#hairg)"/>
        <path d="M520 226 C 570 250 588 302 578 356"
              fill="none" stroke="#6F4D35" stroke-width="6" stroke-opacity=".38" stroke-linecap="round"/></g>
  
  <g transform="translate(16 0)">
