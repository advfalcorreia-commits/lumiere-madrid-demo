<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img">
  <title>Irene — retrato ilustrado de demostración</title>
  
  <rect width="800" height="1000" fill="#F5EDE2"/>
  <defs>
    <radialGradient id="halo" cx="440" cy="400" r="305" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9DBC8" stop-opacity="1"/>
      <stop offset=".6" stop-color="#E9DBC8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#E9DBC8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#3F3A34"/>
      <stop offset="1" stop-color="#28241F"/>
    </linearGradient>
    <linearGradient id="sking" x1=".2" y1=".1" x2=".9" y2=".9">
      <stop offset="0" stop-color="#f0cdac"/>
      <stop offset=".55" stop-color="#E8C5A4"/>
      <stop offset="1" stop-color="#C8A07F"/>
    </linearGradient>
    <linearGradient id="hairg" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#6F4D35"/>
      <stop offset=".4" stop-color="#4A2F1E"/>
      <stop offset="1" stop-color="#452a19"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#halo)"/>
  <circle cx="440" cy="400" r="176.89999999999998" fill="none" stroke="#B99668" stroke-opacity=".26" stroke-width="1.1"/>
  <g transform="translate(400 430) scale(1.34) translate(-400 -430)"><g transform="translate(16 0)">
        <path d="M350 200 C 418 150 506 178 522 260
